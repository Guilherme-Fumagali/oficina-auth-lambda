name: CI/CD

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  AMBIENTE: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}

jobs:
  build-and-test:
    name: Build & testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - run: ./mvnw -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 5

  rede:
    name: Conferir cluster (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: build-and-test
    if: contains(fromJSON('["main", "develop"]'), github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      existe: ${{ steps.rede.outputs.existe }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - id: rede
        run: |
          if SAIDA=$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/private-subnet-ids" 2>&1); then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          elif grep -q ParameterNotFound <<<"$SAIDA"; then
            echo "::notice::Cluster de ${AMBIENTE} desligado, deploy pulado."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          else
            echo "$SAIDA"
            exit 1
          fi

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'prod' || 'staging' }})
    needs: rede
    if: needs.rede.outputs.existe == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: sam validate --lint

      - run: sam build

      - name: Deploy
        run: |
          sam deploy \
            --stack-name oficina-auth-lambda-${AMBIENTE} \
            --parameter-overrides Ambiente=${AMBIENTE} \
                SubnetIds=/oficina/${AMBIENTE}/private-subnet-ids \
                SecurityGroupId=/oficina/${AMBIENTE}/lambda-security-group-id \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Conferir ARNs publicados
        run: |
          aws ssm get-parameter --name "/oficina/${AMBIENTE}/auth-lambda-arn" --query 'Parameter.Value' --output text
          aws ssm get-parameter --name "/oficina/${AMBIENTE}/authorizer-lambda-arn" --query 'Parameter.Value' --output text
