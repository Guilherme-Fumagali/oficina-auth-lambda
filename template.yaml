AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Autenticação por CPF com segundo fator do Tech Challenge Fase 4.

  Duas funções: oficina-auth consulta a identidade no OS Service, envia um código de uso
  único por e-mail e emite o JWT após a confirmação; oficina-authorizer valida o token nas
  rotas protegidas do API Gateway. Ver SPEC-13.

Parameters:
  Ambiente:
    Type: String
    Default: prod
    AllowedValues: [staging, prod]
  SubnetIds:
    Type: AWS::SSM::Parameter::Value<List<String>>
    Default: /oficina/prod/private-subnet-ids
    Description: Subnets privadas publicadas pelo repositório oficina-infra-k8s.
  SecurityGroupId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /oficina/prod/lambda-security-group-id
  RemetenteEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: informe um endereço de e-mail.
    Description: Remetente dos códigos de acesso; a identidade é criada no SES por esta stack.
  ConcorrenciaReservada:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Execuções simultâneas reservadas para oficina-auth. 0 não reserva, usando o limite da conta.

Conditions:
  ReservaConcorrencia: !Not [!Equals [!Ref ConcorrenciaReservada, 0]]

Globals:
  Function:
    Runtime: java21
    # arm64 é mais barato que x86 na tabela do Lambda (Aula 02 de Serverless).
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/oficina-lambda-boundary'
    Environment:
      Variables:
        SSM_PREFIX: !Sub '/oficina/${Ambiente}'
    VpcConfig:
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds: [!Ref SecurityGroupId]

Resources:

  TabelaDesafios:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub 'oficina-auth-desafios-${Ambiente}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: desafioId
          AttributeType: S
      KeySchema:
        - AttributeName: desafioId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiraEm
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  IdentidadeRemetente:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref RemetenteEmail

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'oficina-auth-${Ambiente}'
      CodeUri: .
      Handler: com.oficina.auth.handler.AuthHandler::handleRequest
      Description: Consulta o OS Service, envia o código por e-mail e emite o JWT após a confirmação.
      ReservedConcurrentExecutions: !If [ReservaConcorrencia, !Ref ConcorrenciaReservada, !Ref AWS::NoValue]
      Environment:
        Variables:
          TABELA_DESAFIOS: !Ref TabelaDesafios
          REMETENTE_EMAIL: !Ref IdentidadeRemetente
      Policies:
        - VPCAccessPolicy: {}
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Sub '/oficina/${Ambiente}/*'
        - DynamoDBCrudPolicy:
            TableName: !Ref TabelaDesafios
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: '*'
              Condition:
                StringEquals:
                  'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
            - Effect: Allow
              Action: [ses:SendEmail]
              Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*'
              Condition:
                StringEquals:
                  'ses:FromAddress': !Ref RemetenteEmail

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'oficina-authorizer-${Ambiente}'
      CodeUri: .
      Handler: com.oficina.auth.handler.AuthorizerHandler::handleRequest
      Description: Valida o JWT das rotas protegidas do API Gateway.
      MemorySize: 256
      Timeout: 5
      VpcConfig: !Ref AWS::NoValue
      Policies:
        - SSMParameterWithSlashPrefixReadPolicy:
            ParameterName: !Sub '/oficina/${Ambiente}/*'
        - Statement:
            - Effect: Allow
              Action: [kms:Decrypt]
              Resource: '*'
              Condition:
                StringEquals:
                  'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # ARNs publicados para o repositório oficina-infra-k8s montar as rotas do gateway.
  # É o contrato entre repositórios descrito na SPEC-05 §5.
  AuthFunctionArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/oficina/${Ambiente}/auth-lambda-arn'
      Type: String
      Value: !GetAtt AuthFunction.Arn

  AuthorizerFunctionArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/oficina/${Ambiente}/authorizer-lambda-arn'
      Type: String
      Value: !GetAtt AuthorizerFunction.Arn

Outputs:
  AuthFunctionArn:
    Value: !GetAtt AuthFunction.Arn
  AuthorizerFunctionArn:
    Value: !GetAtt AuthorizerFunction.Arn
